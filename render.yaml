services:
  - type: web
    name: clientops-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ENVIRONMENT
        value: production
      - key: GRANITE_MODEL_ID
        value: ibm/granite-3-8b-instruct
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
